name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Run backend tests
        run: uv run --python ${{ matrix.python-version }} --project backend --directory backend python -m pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the tag matches the package version
        run: test "v$(uv version --project backend --short)" = "$GITHUB_REF_NAME"
      - name: Build the page
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build the wheel
        run: uv build --project backend --wheel --out-dir dist
      - name: Install the wheel and load the page
        run: |
          uv tool install --python 3.12 dist/*.whl
          cd "$RUNNER_TEMP"
          "$(uv tool dir --bin)/trellis" --port 47811 --only claude &
          sleep 5
          curl --fail --silent http://127.0.0.1:47811/ | grep -q "<title>Trellis"
          curl --fail --silent http://127.0.0.1:47811/api/health
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" --generate-notes
