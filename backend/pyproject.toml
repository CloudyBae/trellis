[project]
name = "trellis-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.1",
    "pydantic==2.13.5",
    "typer==0.27.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.12.11",
]

[tool.ruff]
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
include = ["trellis", "tests"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
